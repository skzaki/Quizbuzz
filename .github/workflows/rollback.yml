name: Rollback QuizBuzz

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Commit SHA to roll back to
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    steps:
      - name: Roll back VPS to SHA
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_TAG: sha-${{ inputs.git_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_OWNER,IMAGE_TAG
          script: |
            set -e
            cd /opt/quizbuzz

            export GHCR_OWNER="$GHCR_OWNER"
            export IMAGE_TAG="$IMAGE_TAG"

            echo "Logging in to GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Pulling rollback images"
            docker pull ghcr.io/${GHCR_OWNER}/quizbuzz-backend:${IMAGE_TAG}
            docker pull ghcr.io/${GHCR_OWNER}/quizbuzz-frontend:${IMAGE_TAG}
            docker pull ghcr.io/${GHCR_OWNER}/quizbuzz-worker:${IMAGE_TAG}

            echo "Applying rollback"
            docker compose up -d

            echo "Rollback complete"