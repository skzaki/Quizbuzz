name: Deploy QuizBuzz

on:
  push:
    branches:
      - main
      - second
      - third
    paths:
      - "Backend/**"
      - "Frontend/**"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: quizbuzz-deploy-main
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Run backend tests
        working-directory: Backend
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --coverage --passWithNoTests

      - name: Run backend lint
        working-directory: Backend
        run: npm run lint

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222 
          script: |
            set -e
            cd /var/www/quizbuzz

            echo "Pulling latest code"
            git pull origin ${{ github.ref_name }}

            echo "Building and starting containers"
            docker compose up -d --build

            echo "Cleaning up old images"
            docker image prune -f --filter "until=72h"

            echo "Deploy complete"
            docker compose ps

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Post success notification
        if: needs.deploy.result == 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"channel":"C0B057XKTT9","text":"✅ QuizBuzz deployed successfully\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}"}' \
            "$SLACK_WEBHOOK_URL"

      - name: Post failure notification
        if: needs.deploy.result != 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"channel":"C0B057XKTT9","text":"❌ QuizBuzz deploy failed\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "$SLACK_WEBHOOK_URL"