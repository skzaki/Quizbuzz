services:
  mongo:
    image: mongo
    container_name: quizbuzz-mongo
    ports:
      - "27017:27017"
    volumes:
      - quizbuzz-mongo-data:/data/db
      - quizbuzz-mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: quizbuzz-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - quizbuzz-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./Backend
    container_name: quizbuzz-backend
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  worker:
    build: ./Backend
    container_name: quizbuzz-worker
    command: ["node", "worker/evaluationWorker.js"]
    env_file:
      - ./Backend/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./Frontend
    container_name: quizbuzz-frontend
    ports:
      - "3000:80"
    env_file:
      - ./Frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  quizbuzz-mongo-data:
  quizbuzz-mongo-config:
  quizbuzz-redis-data:
