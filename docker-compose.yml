services:
  frontend:
    build:
      context: ./Frontend
      args:
        VITE_URL: ${VITE_API_URL:-https://quiz.ysminfosolution.com/api}
        VITE_WEBSOCKET_URL: ${VITE_SOCKET_URL:-wss://quiz.ysminfosolution.com/socket.io}
        VITE_SECRET_KEY: ${VITE_SECRET_KEY:-quizbuzz_secret}
    image: ghcr.io/${GHCR_OWNER:-local}/quizbuzz-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://quiz.ysminfosolution.com/api}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-wss://quiz.ysminfosolution.com/socket.io}
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_network

  backend:
    build: ./Backend
    image: ghcr.io/${GHCR_OWNER:-local}/quizbuzz-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./Backend/.env
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app_network

  worker:
    build: ./Backend
    image: ghcr.io/${GHCR_OWNER:-local}/quizbuzz-worker:${IMAGE_TAG:-latest}
    command: ["node", "workers/index.js"]
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

volumes:
  mongo_data:
  redis_data:

networks:
  app_network:
    driver: bridge